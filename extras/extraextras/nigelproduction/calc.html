<!DOCTYPE html>

<html>
    <head>
        
        <title>javascript: calculate two numbers</title>
        
        
        <script>
            
            function calc()
            {
                var n1 = parseFloat(document.getElementById('n1').value);
                var n2 = parseFloat(document.getElementById('n2').value);
                
                var oper = document.getElementById('operators').value;
                
                if(oper === '+')
                {
                    document.getElementById('result').value = n1+n2;
                }
                
                if(oper === '-')
                {
                    document.getElementById('result').value = n1-n2;
                }
                
                if(oper === '/')
                {
                    document.getElementById('result').value = n1/n2;
                }
                
                if(oper === 'X')
                {
                    document.getElementById('result').value = n1*n2;
                }
            }
            
        </script>
        
    </head>
    <body>
        
        <input type="text" id="n1"/><br/><br/>
        <input type="text" id="n2"/><br/><br/>
        
        <select id="operators">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="/">/</option>
            <option value="X">X</option>
        </select>
        
        <button onclick="calc();">=</button>
        <input type="text" id="result"/>
        <p>This Calculator was copied from:<a href="http://1bestcsharp.blogspot.com/2017/01/javascript-addition-subtraction-multiplication-division.html">http://1bestcsharp.blogspot.com/2017/01/javascript-addition-subtraction-multiplication-division.html</a>, because my creator was to lazy to make a calculator.</p>
    </body>
</html>
