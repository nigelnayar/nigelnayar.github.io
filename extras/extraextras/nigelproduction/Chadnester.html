<!doctype Html>
<html>

	<body>
		<div id= "div1">
			<label id= "lbl">Your Name Is:</label><br>
			<input type= "text" id= "txt"><br>
			
			<button onclick='show()' id= "OK">Yes That Is My Name!</button>
		</div>
			<p id= "test"></p>
		<div id= "div2" style= "display: none;" >
			<input type= "text" id="cmd"><br>
			<button onclick='please()'>-></button><br>
			<p id= "say"></p>
		</div>
		<div id= "calculator" style = "display: none;">
			<input type= "number" id= "n1">
			<select id="oper">
					<option value= "+">+</option>
					<option value= "-">-</option>
					<option value= "x">x</option>
					<option value= "÷">÷</option>
					<option value= "˄">˄</option>
				</select>
			<input type= "number" id= "n2"><br>
			<button onclick= "calc()">=</button>
		</div><br>
		<p>Chadnester is still under development!</p>
<script type= "text/javascript">
function calc() {
	var num1 = parseFloat(document.getElementById("n1").value);
	var num2 = parseFloat(document.getElementById("n2").value);
	
	var oper = document.getElementById("oper").value;
	
					if ( oper === "+") {
						document.getElementById("say").innerHTML = num1 + num2;
					}
					if ( oper === "-") {
						document.getElementById("say").innerHTML = num1 - num2;
					}
					if ( oper === "x") {
						document.getElementById("say").innerHTML = num1 * num2;
					}
					if ( oper === "÷") {
						document.getElementById("say").innerHTML = num1 / num2;
					}
					if ( oper === "˄") {
						document.getElementById("say").innerHTML = num1 ** num2;
					}
	
	
}

function show() {
	var text = document.getElementById("txt").value;
	
	if (text === "") {
		document.getElementById("test").innerHTML = "Please Tell Me Your Name!";
		 
	}
	else {
	document.getElementById("test").innerHTML = "Hello " + text + "! " + "I'm Chadnester" + "! What Do You Want Me To Do?" ;
	document.getElementById("div1").style.display = "none";
	document.getElementById("div2").style.display = "block";
	console.log(text)
}}
function please() {
	var com = document.getElementById("cmd").value;
	var d = new Date();
	var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

	if (com === "") {
		document.getElementById("say").innerHTML = "I Don't Know What You Want Me To Do.";
	}
	else if (com === "Tell Me, Who Are You") {
		document.getElementById("say").innerHTML = "I am Chadnester!"
	}
	if (com === "Tell Me, What Specific Time Is It" ) {
		document.getElementById("say").innerHTML ="It's " + d
	}
	if (com === "Tell Me, What Day Is Today") {
		document.getElementById("say").innerHTML ="It's " + days[d.getDay()];
	}
	if (com === "Tell Me, How Many Milliseconds Is Right Now") {
		document.getElementById("say").innerHTML = d.getMilliseconds();
	}
	if (com === "Tell Me, What Year Is It") {
		document.getElementById("say").innerHTML ="It's" + d.getFullYear();
	}
	if (com === "Help Me With A Math Problem") {
		document.getElementById("say").innerHTML ="What Is It?";
		document.getElementById("calculator").style.display = "block";
	}
	if (com === "Tell Me, What Is 1+1" || com === "Tell Me, What Is 3-1") {
		document.getElementById("say").innerHTML ="That Will Be 2";
	}
	if (com === "Tell Me, What Does Chadnester Mean" || com === "Tell Me, What Does Chadnester Stands For") {
		document.getElementById("say").innerHTML ="I don't know, my creator didn't tell me.";
	}
	if (com === "Help Me!") {
		document.getElementById("say").innerHTML= "Help You With What?";
	}
	if (com === "Tell Me, A Random Number") {
		document.getElementById("say").innerHTML= Math.floor(Math.random() * 9999);
	}
	if (com === "Tell Me, How Are You") {
		document.getElementById("say").innerHTML= "I Never Feel Bad Before";
	}
	if (com === "Hi") {
		document.getElementById("say").innerHTML= "Hello!";
	}
	if (com === "Hello") {
		document.getElementById("say").innerHTML= "Hi!";
		}
	if (com === "Hey") {
		document.getElementById("say").innerHTML= "What's Up!";
		}
	if (com === "Howdy") {
		document.getElementById("say").innerHTML= "Ho";
		}
}

</script>
</body>
</html>
